<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Сумая, прости меня 🙈 Тёплая открытка с извинениями и смешными обезьянками.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Сумая, прости меня 🙈">
  <meta property="og:description" content="Эти обезьянки пришли извиниться за меня. Открой открытку 💛">
  <meta property="og:locale" content="ru_RU">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Сумая, прости меня 🙈">
  <meta name="twitter:description" content="Эти обезьянки пришли извиниться за меня. Открой открытку 💛">
  <meta name="theme-color" content="#ffbd83">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='88'%3E%F0%9F%99%88%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Pacifico&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <title>Сумая, прости меня 🙈</title>
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>
  <div id="monkey-field" class="monkey-field" aria-label="Плавающие обезьянки"></div>
  <div id="banana-field" class="banana-field" aria-hidden="true"></div>

  <main>
    <section class="hero section" id="hero" aria-labelledby="hero-title">
      <div class="counter" aria-live="polite"><span id="counter-label"></span> <strong id="monkey-count">5</strong></div>
      <p class="eyebrow" id="hero-eyebrow"></p>
      <h1 id="hero-title"></h1>
      <p class="hero-subtitle" id="hero-subtitle"></p>
      <button class="hero-monkey" id="hero-monkey" type="button" aria-label="Большая обезьянка с табличкой. Нажми пять раз для сюрприза.">
        <span class="hero-monkey-face" aria-hidden="true">🙈</span>
        <span class="sign" id="monkey-sign"></span>
        <span class="hero-speech" id="hero-speech" aria-live="polite"></span>
      </button>
      <a class="scroll-hint" href="#letter" id="scroll-link"></a>
    </section>

    <section class="section letter-section" id="letter" aria-labelledby="letter-title">
      <p class="eyebrow" id="letter-eyebrow"></p>
      <h2 id="letter-title"></h2>
      <article class="glass letter-card">
        <div id="letter-copy" class="letter-copy" aria-live="polite"></div>
        <p class="signature" id="signature"></p>
      </article>
    </section>

    <section class="section reasons-section" id="reasons" aria-labelledby="reasons-title">
      <p class="eyebrow" id="reasons-eyebrow"></p>
      <h2 id="reasons-title"></h2>
      <p class="section-hint" id="reasons-hint"></p>
      <div class="reason-grid" id="reason-grid"></div>
    </section>

    <section class="section question-section" id="question" aria-labelledby="question-title">
      <p class="eyebrow" id="question-eyebrow"></p>
      <h2 id="question-title"></h2>
      <p class="question-note" id="question-note"></p>
      <div class="answer-arena" id="answer-arena">
        <button class="button button-yes" id="yes-button" type="button"></button>
        <button class="button button-no" id="no-button" type="button"></button>
      </div>
    </section>

    <section class="section finale-section" id="finale" aria-labelledby="finale-title" hidden>
      <div class="finale-monkeys" aria-hidden="true">🐒 💃 🐵 🕺 🙈</div>
      <p class="eyebrow" id="finale-eyebrow"></p>
      <h2 id="finale-title"></h2>
      <p class="finale-promise" id="finale-promise"></p>
      <button class="button button-yes replay-button" id="replay-button" type="button"></button>
    </section>
  </main>

  <button class="banana-rain-button" id="banana-rain-button" type="button"></button>
  <div class="sr-only" id="announcement" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js" defer></script>
  <script src="script.js" defer></script>
</body>
</html>
