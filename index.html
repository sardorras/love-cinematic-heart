<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOVE - Cinematic Heart Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            background: linear-gradient(135deg, #0a0a15 0%, #1a0a1a 100%);
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
        }

        .container {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .heart-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .text-section {
            position: absolute;
            bottom: 10%;
            text-align: center;
            opacity: 0;
            animation: fadeInText 1s ease-out 3.5s forwards;
        }

        .main-text {
            font-size: clamp(2rem, 8vw, 5rem);
            font-weight: 300;
            letter-spacing: 8px;
            background: linear-gradient(135deg, #ff1493, #ff69b4, #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 20px rgba(255, 20, 147, 0.5);
            filter: drop-shadow(0 0 10px rgba(255, 20, 147, 0.3));
        }

        .subtitle {
            font-size: clamp(0.75rem, 2vw, 1rem);
            letter-spacing: 2px;
            color: rgba(255, 192, 203, 0.6);
            margin-top: 20px;
            font-weight: 300;
            text-transform: uppercase;
            animation: fadeInSubtitle 1.5s ease-out 4s forwards;
            opacity: 0;
        }

        @keyframes fadeInText {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInSubtitle {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .glow-effect {
            position: absolute;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="container">
        <div class="heart-container"></div>
        <div class="text-section">
            <div class="main-text">LOVE</div>
            <div class="subtitle">made of a thousand little words</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // Canvas setup
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Word object class
        class Word {
            constructor(x, y, targetX, targetY, size) {
                this.x = x;
                this.y = y;
                this.targetX = targetX;
                this.targetY = targetY;
                this.size = size;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.05;
                this.opacity = Math.random() * 0.6 + 0.4;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                this.phase = 'floating';
                this.progress = 0;
                this.text = 'LOVE';
            }

            update(deltaTime, animationPhase, animationProgress) {
                if (animationPhase === 'floating') {
                    this.x += this.vx;
                    this.y += this.vy;
                    this.rotation += this.rotationSpeed;

                    // Bounce off edges
                    if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                    if (this.y < 0 || this.y > canvas.height) this.vy *= -1;

                    this.x = Math.max(0, Math.min(canvas.width, this.x));
                    this.y = Math.max(0, Math.min(canvas.height, this.y));
                } else if (animationPhase === 'forming') {
                    this.moveToTarget(animationProgress);
                } else if (animationPhase === 'pulsing') {
                    this.pulseBehavior(animationProgress);
                } else if (animationPhase === 'exploding') {
                    this.explodeBehavior(animationProgress);
                } else if (animationPhase === 'reforming') {
                    this.moveToTarget(animationProgress);
                }
            }

            moveToTarget(progress) {
                const easeProgress = this.easeInOutCubic(progress);
                this.x = this.x + (this.targetX - this.x) * easeProgress * 0.15;
                this.y = this.y + (this.targetY - this.y) * easeProgress * 0.15;
            }

            pulseBehavior(progress) {
                const pulsePhase = (progress % 1) * Math.PI * 2;
                const pulse = Math.sin(pulsePhase) * 3;
                this.x = this.targetX + Math.cos(this.rotation) * pulse;
                this.y = this.targetY + Math.sin(this.rotation) * pulse;
            }

            explodeBehavior(progress) {
                const dx = this.x - this.targetX;
                const dy = this.y - this.targetY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist < 0.1) {
                    const angle = Math.random() * Math.PI * 2;
                    this.vx = Math.cos(angle) * 5;
                    this.vy = Math.sin(angle) * 5;
                }

                this.x += this.vx;
                this.y += this.vy;
                this.vx *= 0.95;
                this.vy *= 0.95;
            }

            easeInOutCubic(t) {
                return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.font = `${this.size}px 'Segoe UI'`;
                ctx.fillStyle = `rgba(255, 20, 147, ${this.opacity})`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowColor = `rgba(255, 105, 180, 0.8)`;
                ctx.shadowBlur = this.size * 0.5;
                ctx.fillText(this.text, 0, 0);
                ctx.restore();
            }
        }

        // Heart shape generator
        function generateHeartPath(centerX, centerY, scale) {
            const points = [];
            const resolution = 100;

            for (let t = 0; t < Math.PI * 2; t += (Math.PI * 2) / resolution) {
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
                points.push({
                    x: centerX + x * scale,
                    y: centerY + y * scale
                });
            }

            return points;
        }

        // Fill heart with target positions
        function generateHeartTargets(centerX, centerY, scale, count) {
            const targets = [];
            const heartPath = generateHeartPath(centerX, centerY, scale);

            // Distribute points inside the heart
            for (let i = 0; i < count; i++) {
                const t = i / count;
                const pathIndex = Math.floor(t * heartPath.length);
                const point = heartPath[pathIndex];

                // Add some variation
                const angle = Math.random() * Math.PI * 2;
                const radius = Math.random() * scale * 2;

                targets.push({
                    x: point.x + Math.cos(angle) * radius,
                    y: point.y + Math.sin(angle) * radius
                });
            }

            return targets;
        }

        // Initialize words
        const wordCount = 400;
        const words = [];
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const heartScale = Math.min(canvas.width, canvas.height) * 0.12;
        const heartTargets = generateHeartTargets(centerX, centerY, heartScale, wordCount);

        for (let i = 0; i < wordCount; i++) {
            const startX = Math.random() * canvas.width;
            const startY = Math.random() * canvas.height;
            const targetX = heartTargets[i].x;
            const targetY = heartTargets[i].y;
            const size = Math.random() * 8 + 6;

            words.push(new Word(startX, startY, targetX, targetY, size));
        }

        // Animation state
        let animationPhase = 'floating';
        let animationProgress = 0;
        let phaseStartTime = Date.now();
        const phaseDuration = {
            floating: 2000,
            forming: 3000,
            pulsing: 2500,
            exploding: 800,
            reforming: 2000
        };

        // Particles
        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 8;
                this.vy = (Math.random() - 0.5) * 8 - 2;
                this.life = 1;
                this.size = Math.random() * 3 + 1;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.1; // gravity
                this.life -= 0.02;
            }

            draw(ctx) {
                ctx.fillStyle = `rgba(255, 105, 180, ${this.life})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        let particles = [];

        function createExplosionParticles(x, y, count) {
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y));
            }
        }

        // Draw glow effect
        function drawGlowEffect() {
            const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, heartScale * 3);
            gradient.addColorStop(0, 'rgba(255, 20, 147, 0.1)');
            gradient.addColorStop(1, 'rgba(255, 20, 147, 0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        // Main animation loop
        function animate() {
            const now = Date.now();
            const elapsed = now - phaseStartTime;
            animationProgress = elapsed / phaseDuration[animationPhase];

            // Phase transitions
            if (animationProgress >= 1) {
                const phases = ['floating', 'forming', 'pulsing', 'exploding', 'reforming'];
                const currentIndex = phases.indexOf(animationPhase);
                animationPhase = phases[(currentIndex + 1) % phases.length];
                phaseStartTime = now;
                animationProgress = 0;

                if (animationPhase === 'exploding') {
                    for (let i = 0; i < Math.random() * 30 + 20; i++) {
                        const word = words[Math.floor(Math.random() * words.length)];
                        createExplosionParticles(word.x, word.y, 2);
                    }
                }
            }

            // Clear canvas
            ctx.fillStyle = 'rgba(10, 10, 21, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw glow in forming/pulsing phases
            if (animationPhase === 'forming' || animationPhase === 'pulsing' || animationPhase === 'exploding') {
                drawGlowEffect();
            }

            // Update and draw words
            for (let word of words) {
                word.update(1, animationPhase, animationProgress);
                word.draw(ctx);
            }

            // Update and draw particles
            particles = particles.filter(p => p.life > 0);
            for (let particle of particles) {
                particle.update();
                particle.draw(ctx);
            }

            // Draw background stars effect
            if (Math.random() > 0.95) {
                ctx.fillStyle = `rgba(255, 255, 255, ${Math.random() * 0.5})`;
                const starX = Math.random() * canvas.width;
                const starY = Math.random() * canvas.height;
                ctx.beginPath();
                ctx.arc(starX, starY, 1, 0, Math.PI * 2);
                ctx.fill();
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
